name: Standalone CI

on:
  push:
    branches:
      - standalone-dev
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: standalone-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile standalone control and service entrypoints
        run: |
          python -m py_compile tools/bootstrap_from_uwa.py
          python -m py_compile tools/install_codex_uwa_commands.py
          python -m py_compile tools/codex_provider_switch.py
          python -m py_compile tools/codex_uwa_lifecycle.py
          python -m py_compile start.py
          python -m py_compile main.py
          python -m py_compile app/api/standalone_routes.py
          python -m py_compile app/api/codex_runtime.py
          python -m py_compile app/api/chat.py
          python -m py_compile app/services/codex_chatgpt_executor.py
      - name: Validate release metadata
        run: |
          test -f README.md
          test -f README.en.md
          test -f README.zh-CN.md
          test -f NOTICE.md
          test -f SECURITY.md
          test -f .env.example
          test -f VERSION
          test -f docs/RELEASE_PROCESS.md
      - name: Validate standalone import boundary
        run: python -m unittest tests.test_standalone_api_import_boundary
      - name: Validate standalone entrypoint boundary
        run: python -m unittest tests.test_standalone_entrypoint
      - name: Validate extracted tree when present
        shell: bash
        run: |
          if [ -f SOURCE_BASELINE ]; then
            test -f LICENSE
            test -f manifests/bootstrap-candidate.json
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('manifests/bootstrap-candidate.json').read_text(encoding='utf-8'))
          assert data['source_commit'] == 'a140002e65a02a3323abcde3e1fdb8674710c996'
          assert data['candidate_file_count'] > 0
          print('EXTRACTED_MANIFEST=PASS')
          PY
          fi

  runtime-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install candidate runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Import standalone application
        run: |
          python - <<'PY'
          import sys
          import main
          from app.api import codex_compact, codex_responses_v2, codex_runtime
          from app.services.codex_chatgpt_executor import execute_chatgpt_nonstream
          paths = {getattr(route, 'path', '') for route in main.app.routes}
          required = {'/', '/health', '/v1/models', '/v1/responses', '/v1/responses/compact'}
          missing = sorted(required - paths)
          assert not missing, f'missing standalone routes: {missing}'
          forbidden_prefixes = ('/api/config', '/api/system', '/api/browser', '/api/provider', '/v1/messages')
          leaked = sorted(path for path in paths if path.startswith(forbidden_prefixes))
          assert not leaked, f'generic UWA routes leaked into standalone app: {leaked}'
          assert 'app.api.legacy_chat_runtime' not in sys.modules, 'legacy generic chat runtime loaded during standalone startup'
          assert codex_runtime._run_chat_completion_final is execute_chatgpt_nonstream
          assert codex_compact._run_chat_completion_final is execute_chatgpt_nonstream
          assert codex_responses_v2._run_chat_completion_final is execute_chatgpt_nonstream
          print('STANDALONE_RUNTIME_IMPORT=PASS')
          print('LEGACY_CHAT_STARTUP_IMPORT=NO')
          print('CODEX_CHATGPT_EXECUTOR_BINDING=PASS')
          PY
      - name: Run focused standalone regression
        run: |
          python -m pytest -q \
            tests/test_codex_compat.py \
            tests/test_codex_runtime_extraction.py \
            tests/test_codex_chatgpt_executor.py \
            tests/test_codex_chatgpt_executor_parity.py \
            tests/test_standalone_api_import_boundary.py \
            tests/test_standalone_entrypoint.py
